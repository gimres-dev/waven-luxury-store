name: t_store
description: "A professional Flutter eCommerce application UI."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.6
  iconsax: ^0.0.8

  # State Management & Local Storage
  get: ^4.6.6
  get_storage: ^2.1.1

  # Firebase & Backend
  firebase_core: 4.9.0
  firebase_auth: 6.5.1
  cloud_firestore: 6.4.1

  # UI Components & Animations
  readmore: ^3.0.0
  flutter_rating_bar: ^4.0.1
  smooth_page_indicator: ^2.0.1
  carousel_slider_plus: ^7.1.1
  lottie: ^3.1.0

  # Utilities
  http: ^1.1.0
  intl: ^0.20.2
  logger: ^2.0.2
  url_launcher: ^6.1.14
  connectivity_plus: ^7.1.1
  google_sign_in: 6.2.1  # <-- Changed to a more stable version for your SDK
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true


  # Assets Mapping
  assets:
    - assets/logos/
    - assets/icons/categories/
    - assets/icons/payment_methods/
    - assets/images/banners/
    - assets/images/products/
    - assets/images/on_boarding_images/
    - assets/images/animations/
    - assets/images/user/
    - assets/images/reviews/

  # Fonts Mapping
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500


 